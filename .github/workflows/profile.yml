name: profile-stats

# Regenera assets/stats.svg e assets/langs.svg. Manual por enquanto:
# para atualizar todo dia, acrescente em "on:" um bloco "schedule: - cron: '17 6 * * *'".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats and language cards
        run: python3 scripts/generate_stats.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update profile stats"
            git push
          fi
